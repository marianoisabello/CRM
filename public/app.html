<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0A0A10">
  <title>CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── Design tokens (v0 → CRM) ───────────────────────────────────────── */
    :root {
      color-scheme: dark;

      --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-serif: 'Instrument Serif', ui-serif, Georgia, serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;

      --background: #0a0a10;
      --foreground: #ffffff;
      --card: #101018;
      --card-foreground: #ffffff;
      --elevated: #16161f;
      --popover: #16161f;
      --popover-foreground: #ffffff;
      --secondary: #1a1a24;
      --secondary-foreground: #ffffff;
      --muted: #1a1a24;
      --muted-foreground: #8a8a9c;
      --border: #22222e;
      --input: #22222e;

      --primary: #2bd4bd;
      --primary-foreground: #04140f;
      --primary-soft: rgb(43 212 189 / 0.12);
      --accent: #8b5cf6;
      --accent-foreground: #ffffff;
      --accent-soft: rgb(139 92 246 / 0.14);
      --ring: #2bd4bd;

      --success: #2bd4bd;
      --success-soft: rgb(43 212 189 / 0.12);
      --warning: #f5b14c;
      --warning-soft: rgb(245 177 76 / 0.14);
      --danger: #f2726d;
      --danger-soft: rgb(242 114 109 / 0.14);
      --info: #6aa6ff;
      --info-soft: rgb(106 166 255 / 0.14);

      --sidebar: #08080d;
      --sidebar-foreground: #ffffff;
      --sidebar-muted: #74748a;
      --sidebar-accent: #16161f;

      --radius: 1rem;
      --radius-sm: 0.5rem;
      --radius-md: 0.75rem;
      --radius-lg: 1rem;
      --radius-xl: 1.25rem;
      --radius-2xl: 1.5rem;
    }

    * { font-family: var(--font-sans); box-sizing: border-box; }
    body {
      background: var(--background);
      color: var(--foreground);
      font-feature-settings: 'cv11', 'ss01';
    }
    .font-data { font-family: var(--font-mono) !important; }
    .tnum { font-variant-numeric: tabular-nums; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--primary);
    }
    .display {
      font-family: var(--font-serif);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.05;
    }
    .grid-bg {
      background-image:
        linear-gradient(to right, rgb(255 255 255 / 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgb(255 255 255 / 0.035) 1px, transparent 1px);
      background-size: 56px 56px;
    }
    .aura { position: relative; }
    .aura::before {
      content: '';
      position: absolute;
      inset-inline: 0;
      top: -220px;
      height: 460px;
      pointer-events: none;
      background:
        radial-gradient(520px 260px at 22% 40%, rgb(43 212 189 / 0.13), transparent 70%),
        radial-gradient(560px 260px at 74% 30%, rgb(139 92 246 / 0.12), transparent 72%);
    }
    .gradient-ring { position: relative; }
    .gradient-ring::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgb(43 212 189 / 0.5), rgb(139 92 246 / 0.45));
      -webkit-mask-image: linear-gradient(#000 0 0), linear-gradient(#000 0 0);
      -webkit-mask-clip: content-box, border-box;
      -webkit-mask-composite: xor;
      mask-image: linear-gradient(#000 0 0), linear-gradient(#000 0 0);
      mask-clip: content-box, border-box;
      mask-composite: exclude;
      pointer-events: none;
    }
    .card-dragging {
      transform: rotate(2deg) scale(1.03);
      box-shadow: 0 22px 50px -14px rgb(43 212 189 / 0.4);
      opacity: 0.96;
    }

    /* Sidebar nav */
    .crm-sidebar .nav-item,
    a.nav-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 999px; font-size: 13px;
      color: var(--sidebar-muted); cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.2s, color 0.2s, transform 0.2s; user-select: none;
      text-decoration: none;
    }
    .crm-sidebar .nav-item:hover,
    a.nav-item:hover {
      background: var(--sidebar-accent); color: var(--sidebar-foreground);
      transform: translateX(2px);
    }
    .crm-sidebar .nav-item.active,
    a.nav-item.active {
      background: var(--primary-soft); color: var(--primary);
      border-color: rgb(43 212 189 / 0.25); font-weight: 600;
    }
    .crm-sidebar .nav-sub,
    a.nav-sub {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px 6px 28px; border-radius: 999px; font-size: 12px;
      color: var(--sidebar-muted); cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.2s, color 0.2s; user-select: none;
      text-decoration: none;
    }
    .crm-sidebar .nav-sub:hover,
    a.nav-sub:hover { color: var(--sidebar-foreground); background: var(--sidebar-accent); }
    .crm-sidebar .nav-sub.active,
    a.nav-sub.active { color: var(--primary); background: var(--primary-soft); border-color: rgb(43 212 189 / 0.2); }
    .nav-section {
      font-family: var(--font-mono);
      font-size: 10px; color: var(--sidebar-muted);
      text-transform: uppercase; letter-spacing: 0.14em;
      padding: 0 12px; margin: 16px 0 4px;
    }
    .nav-group-toggle { justify-content: space-between; color: var(--sidebar-muted); }
    .nav-group-toggle .nav-group-label { display: flex; align-items: center; gap: 8px; min-width: 0; color: inherit; }
    .nav-chevron { width: 14px; height: 14px; flex-shrink: 0; transition: transform 0.15s; opacity: 0.7; color: inherit; }
    .nav-group.open .nav-chevron { transform: rotate(90deg); }
    .nav-group-children {
      display: none; margin: 2px 0 4px; padding-left: 2px;
      border-left: 2px solid rgb(43 212 189 / 0.35); margin-left: 14px;
    }
    .nav-group.open .nav-group-children { display: block; }
    .crm-sidebar .nav-sub.nav-chatbox,
    a.nav-sub.nav-chatbox {
      color: var(--primary); font-weight: 600; font-size: 13px;
      padding: 7px 12px 7px 12px;
      background: var(--primary-soft); border: 1px solid rgb(43 212 189 / 0.3);
    }
    .crm-sidebar .nav-sub.nav-chatbox:hover,
    a.nav-sub.nav-chatbox:hover { color: var(--foreground); background: rgb(43 212 189 / 0.2); }
    .crm-sidebar .nav-sub.nav-chatbox.active,
    a.nav-sub.nav-chatbox.active {
      color: var(--primary); background: rgb(43 212 189 / 0.22);
      border-color: rgb(43 212 189 / 0.45);
    }

    .crm-sidebar {
      height: 100vh; max-height: 100vh; overflow: hidden;
      background: var(--sidebar);
      color: var(--sidebar-muted);
      border-right: 1px solid var(--border);
    }
    .crm-sidebar-nav {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #2c2c3a transparent;
    }
    .crm-sidebar-header, .crm-sidebar-footer { flex-shrink: 0; border-color: var(--border) !important; }
    .crm-sidebar svg { color: inherit; stroke: currentColor; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 20px; color: var(--card-foreground);
    }
    .card-sm {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px; color: var(--card-foreground);
    }
    .kpi-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 18px 20px;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .kpi-card:hover {
      background: var(--elevated);
      border-color: rgb(43 212 189 / 0.25);
      box-shadow: 0 0 30px -12px rgb(43 212 189 / 0.35);
    }

    th {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted-foreground); background: var(--secondary);
    }
    tr.data-row:hover td { background: var(--elevated); }
    tr.lead-row:hover td { background: var(--elevated); cursor: pointer; }

    .badge {
      font-size: 11px; font-weight: 600; padding: 2px 10px;
      border-radius: 999px; display: inline-flex; align-items: center; gap: 4px;
    }
    .badge-neutral { background: var(--secondary); color: var(--muted-foreground); border: 1px solid var(--border); }
    .badge-info { background: var(--info-soft); color: var(--info); border: 1px solid rgb(106 166 255 / 0.3); }
    .badge-success { background: var(--success-soft); color: var(--success); border: 1px solid rgb(43 212 189 / 0.3); }
    .badge-warning { background: var(--warning-soft); color: var(--warning); border: 1px solid rgb(245 177 76 / 0.3); }
    .badge-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid rgb(242 114 109 / 0.3); }
    .badge-accent { background: var(--accent-soft); color: #a78bfa; border: 1px solid rgb(139 92 246 / 0.3); }
    .badge-primary { background: var(--primary-soft); color: var(--primary); border: 1px solid rgb(43 212 189 / 0.35); }
    .table-shell { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; }

    .btn-primary {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      color: var(--primary-foreground);
      border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 600;
      transition: box-shadow 0.2s, transform 0.15s; border: none; cursor: pointer;
    }
    .btn-primary:hover {
      box-shadow: 0 0 30px -8px rgb(43 212 189 / 0.6);
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-ghost {
      background: rgb(26 26 36 / 0.6); color: var(--foreground);
      border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500;
      transition: all 0.2s; border: 1px solid var(--border); cursor: pointer;
    }
    .btn-ghost:hover {
      background: var(--primary-soft); border-color: rgb(43 212 189 / 0.4); color: var(--primary);
    }

    .input {
      background: var(--elevated); border: 1px solid var(--input);
      border-radius: var(--radius-md); padding: 8px 12px; font-size: 13px;
      color: var(--foreground); outline: none;
      transition: border-color 0.15s, box-shadow 0.15s; width: 100%;
    }
    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgb(43 212 189 / 0.15);
    }
    .input::placeholder { color: var(--muted-foreground); }
    select.input { cursor: pointer; }
    select.input option { background: var(--elevated); color: var(--foreground); }

    .skeleton {
      background: linear-gradient(90deg, var(--secondary) 25%, var(--elevated) 50%, var(--secondary) 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius-sm);
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .nice-scroll { scrollbar-width: thin; scrollbar-color: #2c2c3a transparent; }
    .nice-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
    .nice-scroll::-webkit-scrollbar-thumb { background: #2c2c3a; border-radius: 999px; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2c2c3a; border-radius: 999px; }

    /* Etapa F — micro-interacciones */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .anim-fade-up { animation: fadeUp 0.45s ease-out both; }
    .kpi-card { animation: fadeUp 0.5s ease-out both; }
    .kpi-card:nth-child(1) { animation-delay: 0.02s; }
    .kpi-card:nth-child(2) { animation-delay: 0.08s; }
    .kpi-card:nth-child(3) { animation-delay: 0.14s; }
    .kpi-card:nth-child(4) { animation-delay: 0.2s; }
    .kpi-card:nth-child(5) { animation-delay: 0.26s; }
    .kpi-card:nth-child(6) { animation-delay: 0.32s; }
    tr.lead-row, tr.data-row { transition: background 0.15s ease; }
    .kanban-card { transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s; }
    .kanban-card:hover { transform: translateY(-1px); }
    .kanban-card.card-dragging { transform: rotate(2deg) scale(1.03); }
    @media (prefers-reduced-motion: reduce) {
      .anim-fade-up, .kpi-card { animation: none; }
    }
  </style>
</head>

            Calendario
          </a>
          <a href="#chatbox" class="nav-sub nav-chatbox" data-view="chatbox" title="Lead scoring Chatbox">
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
            Chatbox
          </a>
        </div>
      </div>
      <a href="#settings" class="nav-item" data-view="settings">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Configuración
      </a>
    </nav>

    <div class="crm-sidebar-footer px-3 py-3 flex items-center gap-2.5" style="border-top:1px solid var(--border);">
      <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0"
           style="background:var(--primary-soft);color:var(--primary);" id="user-avatar">M</div>
      <div class="min-w-0 flex-1">
        <p id="user-name" class="text-xs font-semibold truncate" style="color:var(--sidebar-foreground);">—</p>
        <p id="user-email" class="text-[11px] truncate" style="color:var(--sidebar-muted);">—</p>
      </div>
      <button onclick="logout()" title="Salir" class="transition shrink-0" style="color:var(--sidebar-muted);"
        onmouseover="this.style.color='var(--danger)'" onmouseout="this.style.color='var(--sidebar-muted)'">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="ml-64 flex-1 min-h-screen" style="background:var(--background);">
    <div id="view-root" class="p-7 max-w-7xl mx-auto"></div>
  </main>

  <!-- Modal Lead -->
  <div id="lead-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(0,0,0,0.55);">
    <div class="w-full max-w-lg max-h-[88vh] flex flex-col rounded-xl shadow-2xl"
         style="background:var(--card);border:1px solid var(--border);">
      <div class="flex items-start justify-between p-5" style="border-bottom:1px solid var(--border);">
        <div>
          <h2 id="modal-name" class="font-semibold text-base" style="color:var(--foreground);"></h2>
          <p id="modal-source" class="text-xs mt-0.5" style="color:var(--muted-foreground);"></p>
        </div>
        <button onclick="closeModal()" class="transition p-1 rounded-lg"
                style="color:var(--muted-foreground);"
                onmouseover="this.style.background='var(--elevated)';this.style.color='var(--foreground)'"
                onmouseout="this.style.background='transparent';this.style.color='var(--muted-foreground)'">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-body" class="overflow-y-auto p-5 space-y-4 flex-1 nice-scroll"></div>
      <div class="p-4" id="modal-footer" style="border-top:1px solid var(--border);background:var(--elevated);">
        <p class="text-xs mb-2.5 font-semibold uppercase tracking-wider" id="modal-footer-label"
           style="color:var(--muted-foreground);font-family:var(--font-mono);letter-spacing:0.14em;">Cambiar estado</p>
        <div class="flex gap-1.5 flex-wrap" id="modal-status-buttons"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-5 right-5 z-50"></div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/leads.js"></script>
  <script src="/js/views/agent.js"></script>
  <script src="/js/views/propuestas.js"></script>
  <script src="/js/views/calendar.js"></script>
  <script src="/js/views/settings.js"></script>
  <script src="/js/views/pipeline.js"></script>
  <script>
    const token = localStorage.getItem('crm_token');
    if (!token) window.location.href = '/login.html';

    const user = JSON.parse(localStorage.getItem('crm_user') || '{}');
    document.getElementById('user-name').textContent = user.name || user.email || 'Admin';
    document.getElementById('user-email').textContent = user.email || '';
    document.getElementById('user-avatar').textContent = (user.name || user.email || 'A')[0].toUpperCase();

    function logout() {
      localStorage.removeItem('crm_token');
      localStorage.removeItem('crm_user');
      window.location.href = '/login.html';
    }

    function navigate(view) {
      const next = '#' + String(view || 'dashboard').replace(/^#/, '');
      // Always render: hashchange does not fire when the hash is unchanged
      if (window.location.hash === next) {
        renderView(next);
        return;
      }
      window.location.hash = next;
    }

    // Native <a href="#..."> + delegated clicks so nav works even if a handler is missed
    document.getElementById('crm-sidebar-nav').addEventListener('click', (e) => {
      if (e.target.closest('.nav-group-toggle')) return;
      const el = e.target.closest('[data-view]');
      if (!el || !el.dataset.view) return;
      e.preventDefault();
      navigate(el.dataset.view);
    });

    function toggleNavGroup(id) {
      const group = document.getElementById('nav-group-' + id);
      if (!group) return;
      const open = group.classList.toggle('open');
      const toggle = group.querySelector('.nav-group-toggle');
      if (toggle) toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      try { localStorage.setItem('crm_nav_' + id, open ? '1' : '0'); } catch (_) {}
    }

    (function restoreNavGroups() {
      try {
        const saved = localStorage.getItem('crm_nav_herramientas');
        const group = document.getElementById('nav-group-herramientas');
        if (!group) return;
        // Default open so Chatbox is always visible on first visit
        const open = saved == null ? true : saved === '1';
        group.classList.toggle('open', open);
        const toggle = group.querySelector('.nav-group-toggle');
        if (toggle) toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      } catch (_) {}
    })();

    function renderView(hash) {
      const view = (hash || '').replace(/^#/, '') || 'dashboard';

      document.querySelectorAll('.nav-item, .nav-sub').forEach(el => {
        el.classList.toggle('active', el.dataset.view === view);
      });

      // Ensure Herramientas stays open when a child view is active
      if (view === 'pipeline' || view === 'calendar' || view === 'chatbox') {
        const group = document.getElementById('nav-group-herramientas');
        if (group && !group.classList.contains('open')) {
          group.classList.add('open');
          const toggle = group.querySelector('.nav-group-toggle');
          if (toggle) toggle.setAttribute('aria-expanded', 'true');
        }
      }

      const root = document.getElementById('view-root');
      if (!root) return;
      const main = root.parentElement;

      if (view === 'chatbox') {
        // Same-origin embed — Vite build outputs to public/chatbox/ with VITE_* baked in
        const CHATBOX_SRC = window.CRM_CHATBOX_URL || '/chatbox/';
        root.className = 'p-0 max-w-none h-screen';
        if (main) main.style.background = 'var(--background)';
        root.innerHTML = `<iframe
          src="${CHATBOX_SRC}"
          title="Chatbox · Lead scoring"
          class="w-full border-0 block"
          style="height:100vh;background:var(--background);"
          allow="clipboard-write"
        ></iframe>`;
        return;
      }

      root.className = 'p-7 max-w-7xl mx-auto';
      if (main) main.style.background = 'var(--background)';
      root.innerHTML = `<div class="flex items-center justify-center h-64">
        <div class="flex flex-col items-center gap-3" style="color:var(--muted-foreground);">
          <svg class="w-5 h-5 spinning" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>
          <span class="text-sm">Cargando...</span>
        </div>
      </div>`;

      if (view === 'dashboard')           return renderDashboard(root);
      if (view === 'calendar')            return renderCalendar(root);
      if (view === 'settings')            return renderSettings(root);
      if (view === 'pipeline')            return renderPipeline(root);
      if (view === 'propuestas')          return renderPropuestasMenu(root);
      if (view.startsWith('agent/'))      return renderAgent(root, view.split('/')[1]);
      if (view.startsWith('leads')) {
        const source = view.includes('/') ? view.split('/')[1] : null;
        return renderLeads(root, source);
      }

      root.innerHTML = `<div class="p-8 text-sm" style="color:#6B7280;">Vista no encontrada: <code>${view}</code></div>`;
    }

    window.addEventListener('hashchange', () => renderView(window.location.hash));
    renderView(window.location.hash || '#dashboard');

    let currentLeadId = null;
    function openLeadModal(lead) {
      currentLeadId = lead.id;
      window._currentLead = lead;
      document.getElementById('modal-name').textContent = lead.name || 'Sin nombre';
      document.getElementById('modal-source').textContent = (sourceLabel[lead.source] || lead.source) + ' · ' + fmtDate(lead.created_at);
      document.getElementById('modal-body').innerHTML = renderLeadDetail(lead);
      const footer = document.getElementById('modal-footer');
      const footerLabel = document.getElementById('modal-footer-label');
      if (footer) footer.style.display = '';
      if (footerLabel) footerLabel.style.display = '';
      const statuses = ['new','contacted','qualified','won','lost'];
      document.getElementById('modal-status-buttons').innerHTML = statuses.map(s => `
        <button type="button" onclick="changeLeadStatus('${lead.id}','${s}')"
          class="badge cursor-pointer hover:opacity-80 transition py-1 px-3"
          style="${s === lead.status ? statusColors[s] : statusInactive}">
          ${statusLabel[s]}
        </button>`).join('');
      document.getElementById('lead-modal').classList.remove('hidden');
      initLeadPropuestaAssign(lead);
    }

    function closeModal() {
      document.getElementById('lead-modal').classList.add('hidden');
      currentLeadId = null;
      window._currentLead = null;
    }
    document.getElementById('lead-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('lead-modal')) closeModal();
    });

    async function changeLeadStatus(id, status) {
      const res = await api(`/api/leads/${id}/status`, { method: 'PATCH', body: { status } });
      closeModal();
      if (status === 'won' && typeof celebrate === 'function') celebrate();
      if (status === 'qualified') {
        showToast('Estado: Calificado — briefing encolado si hay email');
      } else {
        showToast(`Estado: ${statusLabel[status]}`);
      }
      if (res?.ok === false) showToast(res.error || 'Error al actualizar', 'error');
      renderView(window.location.hash);
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      if (!t) return;
      const isError = type === 'error';
      const accent = isError ? 'var(--danger)' : 'var(--success)';
      t.innerHTML = `<span>${msg}</span>`;
      t.style.cssText = `position:fixed;bottom:20px;right:20px;background:var(--elevated);border:1px solid var(--border);border-left:3px solid ${accent};border-radius:12px;padding:12px 16px;font-size:13px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.35);display:flex;align-items:center;gap:10px;min-width:192px;color:${isError?'var(--danger)':'var(--foreground)'};font-family:var(--font-sans);`;
      t.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        t.classList.add('hidden');
        t.style.display = 'none';
      }, 3500);
    }

    setInterval(() => {
      if ((window.location.hash || '#dashboard') === '#dashboard') renderView('#dashboard');
    }, 60000);
  </script>
</body>
</html>
