<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0A0A10">
  <title>Dana. — CRM Pampai</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230a0a10' stroke='%232bd4bd' stroke-width='2'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%232bd4bd' font-family='Georgia'%3ED%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── Design tokens (crm-dashboard-new-design) ─────────────────────────── */
    :root {
      color-scheme: dark;

      --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
      --font-serif: 'Instrument Serif', ui-serif, Georgia, serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;

      --background: #0a0a10;
      --foreground: #ffffff;
      --card: #101018;
      --card-foreground: #ffffff;
      --elevated: #16161f;
      --popover: #16161f;
      --popover-foreground: #ffffff;
      --secondary: #1a1a24;
      --secondary-foreground: #ffffff;
      --muted: #1a1a24;
      --muted-foreground: #8a8a9c;
      --border: #22222e;
      --input: #22222e;

      --primary: #2bd4bd;
      --primary-foreground: #04140f;
      --primary-soft: rgb(43 212 189 / 0.12);
      --accent: #8b5cf6;
      --accent-foreground: #ffffff;
      --accent-soft: rgb(139 92 246 / 0.14);
      --ring: #2bd4bd;

      --success: #2bd4bd;
      --success-soft: rgb(43 212 189 / 0.12);
      --warning: #f5b14c;
      --warning-soft: rgb(245 177 76 / 0.14);
      --danger: #f2726d;
      --danger-soft: rgb(242 114 109 / 0.14);
      --info: #6aa6ff;
      --info-soft: rgb(106 166 255 / 0.14);

      --sidebar: #08080d;
      --sidebar-foreground: #ffffff;
      --sidebar-muted: #74748a;
      --sidebar-accent: #16161f;

      --radius: 1rem;
      --radius-sm: 0.5rem;
      --radius-md: 0.75rem;
      --radius-lg: 1rem;
      --radius-xl: 1.25rem;
      --radius-2xl: 1.5rem;
    }

    * { font-family: var(--font-sans); box-sizing: border-box; }
    body {
      background: var(--background);
      color: var(--foreground);
      font-feature-settings: 'cv11', 'ss01';
    }
    .font-data { font-family: var(--font-mono) !important; }
    .tnum { font-variant-numeric: tabular-nums; }
    [hidden] { display: none !important; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--primary);
    }
    .display {
      font-family: var(--font-serif);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.05;
    }
    .grid-bg {
      background-image:
        linear-gradient(to right, rgb(255 255 255 / 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgb(255 255 255 / 0.035) 1px, transparent 1px);
      background-size: 56px 56px;
    }
    .aura { position: relative; }
    .aura::before {
      content: '';
      position: absolute;
      inset-inline: 0;
      top: -220px;
      height: 460px;
      pointer-events: none;
      background:
        radial-gradient(520px 260px at 22% 40%, rgb(43 212 189 / 0.13), transparent 70%),
        radial-gradient(560px 260px at 74% 30%, rgb(139 92 246 / 0.12), transparent 72%);
    }
    .gradient-ring { position: relative; }
    .gradient-ring::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgb(43 212 189 / 0.5), rgb(139 92 246 / 0.45));
      -webkit-mask-image: linear-gradient(#000 0 0), linear-gradient(#000 0 0);
      -webkit-mask-clip: content-box, border-box;
      -webkit-mask-composite: xor;
      mask-image: linear-gradient(#000 0 0), linear-gradient(#000 0 0);
      mask-clip: content-box, border-box;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ── Sidebar (diseño nuevo) ───────────────────────────────────────────── */
    .crm-sidebar {
      position: fixed; inset: 0 auto 0 0; width: 16rem; z-index: 40;
      background: var(--sidebar); color: var(--sidebar-foreground);
      border-right: 1px solid var(--border);
    }
    .sb-scroll { overflow-y: auto; overflow-x: hidden; margin: 0 -6px; padding: 0 6px; }
    .sb-item {
      position: relative; display: flex; align-items: center; gap: 12px;
      border-radius: 999px; padding: 10px 12px 10px 16px; font-size: 14px; font-weight: 500;
      color: var(--sidebar-muted); border: 1px solid transparent; text-decoration: none; width: 100%;
      transition: transform 0.2s, background 0.2s, color 0.2s; cursor: pointer; background: none;
    }
    .sb-item:hover { transform: translateX(4px); background: var(--sidebar-accent); color: var(--sidebar-foreground); }
    .sb-item.active { border-color: rgb(43 212 189 / 0.25); background: var(--primary-soft); color: var(--primary); font-weight: 600; }
    .sb-badge {
      border-radius: 999px; background: var(--accent-soft); color: #a78bfa;
      font-family: var(--font-mono); font-size: 10px; padding: 2px 8px; line-height: 1.3;
    }
    .sb-chevron { transition: transform 0.2s; opacity: 0.7; }
    .sb-group.open .sb-chevron { transform: rotate(180deg); }
    .sb-children { display: none; margin: 2px 0 6px 25px; padding-left: 10px; border-left: 1px solid var(--border); }
    .sb-group.open .sb-children { display: flex; flex-direction: column; gap: 1px; }
    .sb-sub {
      display: block; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--sidebar-muted);
      text-decoration: none; border: 1px solid transparent; transition: background 0.2s, color 0.2s;
    }
    .sb-sub:hover { background: var(--sidebar-accent); color: var(--sidebar-foreground); }
    .sb-sub.active { color: var(--primary); background: var(--primary-soft); border-color: rgb(43 212 189 / 0.2); font-weight: 600; }
    .sb-quarter {
      display: flex; flex-direction: column; gap: 10px; border-radius: var(--radius-xl);
      background: var(--sidebar-accent); padding: 16px; text-align: left; width: 100%; cursor: pointer;
    }
    .sb-quarter-bar { transition: width 1s cubic-bezier(0.22, 1, 0.36, 1); }
    .sb-user {
      display: flex; width: 100%; align-items: center; gap: 12px; border-radius: 999px; padding: 8px;
      text-align: left; transition: background 0.2s; background: none; border: 0; cursor: pointer;
    }
    .sb-user:hover { background: var(--sidebar-accent); }

    /* Barra superior */
    .crm-topbar {
      position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; border-bottom: 1px solid var(--border); background: rgb(10 10 16 / 0.8);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 16px 20px;
    }
    @media (min-width: 768px) { .crm-topbar { padding: 16px 32px; } }
    .notif-dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 999px; background: var(--danger); box-shadow: 0 0 0 2px var(--background); }

    /* Popovers / menús */
    .ds-popover {
      position: absolute; z-index: 60; overflow: hidden; border-radius: var(--radius-xl);
      border: 1px solid var(--border); background: var(--popover); padding: 6px;
      box-shadow: 0 24px 60px -12px rgb(0 0 0 / 0.6); animation: fadeIn 0.15s ease-out;
    }
    .ds-menu-item {
      display: flex; width: 100%; align-items: center; gap: 10px; border-radius: 10px; padding: 8px 12px;
      font-size: 14px; font-weight: 500; color: var(--muted-foreground); text-decoration: none; background: none; border: 0;
      cursor: pointer; transition: background 0.15s, color 0.15s; text-align: left;
    }
    .ds-menu-item:hover, .ds-menu-item:focus-visible { background: var(--secondary); color: var(--foreground); outline: none; }

    /* Buscador global */
    .gs-wrap { position: fixed; inset: 0; z-index: 70; background: rgb(4 4 10 / 0.7); backdrop-filter: blur(4px); display: flex; justify-content: center; padding: 12vh 16px 16px; }
    .gs-panel { width: 100%; max-width: 620px; height: fit-content; border-radius: 16px; border: 1px solid var(--border); background: var(--popover); box-shadow: 0 30px 80px -20px rgb(0 0 0 / 0.7); animation: modalIn 0.18s ease-out; }
    .ds-search {
      position: relative; display: flex; align-items: center; gap: 10px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--card); padding: 10px 16px; color: var(--muted-foreground); transition: border-color 0.15s, box-shadow 0.15s;
    }
    .ds-search:focus-within { border-color: rgb(43 212 189 / 0.5); box-shadow: 0 0 0 2px rgb(43 212 189 / 0.3); }
    .ds-search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-size: 14px; color: var(--foreground); }
    .ds-search input::placeholder { color: var(--muted-foreground); }

    /* Badges del diseño */
    .ds-badge { display: inline-flex; align-items: center; border-radius: 999px; line-height: 1; font-weight: 500; white-space: nowrap; border: 1px solid; }
    .ds-badge-sm { font-size: 11px; padding: 3px 8px; gap: 4px; }
    .ds-badge-md { font-size: 12px; padding: 4px 10px; gap: 6px; }
    .ds-badge-lg { font-size: 14px; padding: 6px 12px; gap: 6px; }
    .ds-badge-teal { background: var(--primary-soft); color: var(--primary); border-color: rgb(43 212 189 / 0.25); }
    .ds-badge-violet { background: var(--accent-soft); color: #a78bfa; border-color: rgb(139 92 246 / 0.25); }
    .ds-badge-success { background: var(--success-soft); color: var(--success); border-color: rgb(43 212 189 / 0.25); }
    .ds-badge-warning { background: var(--warning-soft); color: var(--warning); border-color: rgb(245 177 76 / 0.25); }
    .ds-badge-danger { background: var(--danger-soft); color: var(--danger); border-color: rgb(242 114 109 / 0.25); }
    .ds-badge-info { background: var(--info-soft); color: var(--info); border-color: rgb(106 166 255 / 0.25); }
    .ds-badge-neutral { background: var(--secondary); color: var(--muted-foreground); border-color: var(--border); }

    /* KPI row del diseño */
    .ds-kpi-row {
      display: grid; grid-template-columns: 1fr; gap: 1px; overflow: hidden;
      border-radius: var(--radius-xl); border: 1px solid var(--border); background: var(--border);
    }
    @media (min-width: 640px) { .ds-kpi-row { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1280px) { .ds-kpi-row { grid-template-columns: repeat(4, 1fr); } }
    .ds-kpi { position: relative; display: flex; flex-direction: column; gap: 16px; background: var(--card); padding: 20px; transition: background 0.3s; animation: fadeUp 0.5s ease-out both; }
    .ds-kpi:hover { background: var(--elevated); }
    .ds-kpi:nth-child(2) { animation-delay: 0.08s; } .ds-kpi:nth-child(3) { animation-delay: 0.16s; } .ds-kpi:nth-child(4) { animation-delay: 0.24s; }
    .ds-kpi-icon { display: grid; width: 32px; height: 32px; flex-shrink: 0; place-items: center; border-radius: 999px; transition: transform 0.3s; }
    .ds-kpi:hover .ds-kpi-icon { transform: scale(1.1); }
    .ds-kpi-value { font-size: 38px; line-height: 1; color: var(--foreground); }
    .ds-kpi-value, .ds-kpi-value * { font-family: var(--font-serif) !important; font-weight: 400 !important; letter-spacing: -0.01em; }

    /* Kanban del diseño */
    .kanban-col {
      display: flex; width: 288px; flex-shrink: 0; flex-direction: column; gap: 16px; border-radius: var(--radius-xl);
      border: 1px solid var(--border); background: rgb(16 16 24 / 0.6); padding: 14px; transition: background 0.2s, border-color 0.2s;
    }
    .kanban-col.is-won { border-color: rgb(139 92 246 / 0.25); background: rgb(139 92 246 / 0.06); }
    .kanban-col.is-over { border-color: rgb(43 212 189 / 0.5); background: var(--primary-soft); }
    .kanban-card {
      cursor: grab; border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--elevated); padding: 14px;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; animation: fadeUp 0.3s ease-out both;
    }
    .kanban-card:hover { transform: translateY(-2px); border-color: rgb(43 212 189 / 0.4); box-shadow: 0 16px 40px -20px rgb(43 212 189 / 0.5); }
    .kanban-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .kanban-card:active { cursor: grabbing; }
    .kanban-grip { color: #3a3a4a; transition: color 0.2s; }
    .kanban-card:hover .kanban-grip { color: var(--primary); }
    .card-dragging, .kanban-card.card-dragging { transform: rotate(2deg) scale(1.03); box-shadow: 0 22px 50px -14px rgb(43 212 189 / 0.4); opacity: 0.96; }
    .kanban-add {
      display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--radius-lg);
      border: 1px dashed var(--border); padding: 10px 0; font-size: 12px; font-weight: 500; color: var(--muted-foreground);
      background: none; cursor: pointer; transition: all 0.2s;
    }
    .kanban-add:hover { border-color: rgb(43 212 189 / 0.4); background: var(--primary-soft); color: var(--primary); }
    .kanban-col.drop-pulse { animation: dropPulse 0.45s ease-out; }

    /* Drawer de oportunidad */
    .dd-scrim { position: fixed; inset: 0; z-index: 45; background: rgb(4 4 10 / 0.7); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .dd-panel {
      position: fixed; inset: 0 0 0 auto; z-index: 50; display: flex; flex-direction: column; width: 100%; max-width: 580px;
      border-left: 1px solid var(--border); background: var(--background); box-shadow: 0 0 80px rgb(0 0 0 / 0.6);
      transform: translateX(100%); transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.dd-open .dd-scrim { opacity: 1; pointer-events: auto; }
    body.dd-open .dd-panel { transform: none; }
    .dd-icon-btn, .ds-icon-btn { display: inline-grid; place-items: center; border-radius: 999px; border: 1px solid var(--border); padding: 8px; color: var(--muted-foreground); background: none; cursor: pointer; transition: all 0.2s; }
    .dd-icon-btn:hover, .ds-icon-btn:hover { border-color: rgb(43 212 189 / 0.4); color: var(--primary); }
    .dd-progress { transition: width 0.6s ease-out; }
    .dd-stage-btn { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted-foreground); background: none; border: 0; padding: 2px 0; cursor: pointer; }
    .dd-stage-btn.is-done { color: var(--primary); }
    .dd-stage-btn:not(:disabled):hover { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; }
    .dd-stage-btn:disabled { cursor: default; }
    .dd-field {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; border-radius: 10px; border: 1px solid transparent;
      padding: 6px 10px; text-align: left; font-size: 14px; font-weight: 500; color: var(--foreground); background: none; cursor: pointer; transition: all 0.2s; width: 100%;
    }
    .dd-field:hover { border-color: rgb(43 212 189 / 0.25); background: var(--primary-soft); color: var(--primary); }
    .dd-pencil { color: var(--muted-foreground); opacity: 0; transition: opacity 0.2s; }
    .dd-field:hover .dd-pencil { opacity: 1; }
    .dd-edit-input { border-radius: 10px; border: 1px solid rgb(43 212 189 / 0.4); background: var(--secondary); padding: 6px 10px; font-size: 14px; font-weight: 500; color: var(--foreground); outline: none; width: 100%; color-scheme: dark; }
    .dd-edit-input:focus { box-shadow: 0 0 0 2px rgb(43 212 189 / 0.3); }
    .dd-owner { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 10px; border: 1px solid transparent; transition: all 0.2s; }
    .dd-owner:hover { border-color: rgb(43 212 189 / 0.25); background: var(--primary-soft); }
    .dd-owner select { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-size: 14px; font-weight: 500; color: var(--foreground); cursor: pointer; }
    .dd-owner select option { background: var(--elevated); }
    .dd-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--primary); text-decoration: none; padding: 4px 10px; }
    .dd-link:hover { text-decoration: underline; }
    .dd-chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid var(--border); background: var(--secondary); padding: 6px 12px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); cursor: pointer; transition: all 0.2s; }
    .dd-chip:hover { color: var(--foreground); }
    .dd-chip.is-active { border-color: transparent; }
    .dd-input { width: 100%; border-radius: 999px; border: 1px solid var(--border); background: var(--secondary); padding: 10px 16px; font-size: 14px; color: var(--foreground); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
    .dd-input::placeholder { color: var(--muted-foreground); }
    .dd-input:focus { border-color: rgb(43 212 189 / 0.5); box-shadow: 0 0 0 2px rgb(43 212 189 / 0.3); }

    /* Tabla del diseño */
    .ds-table-wrap { overflow: auto; border-radius: var(--radius-xl); border: 1px solid var(--border); background: var(--card); }
    .ds-table { width: 100%; min-width: 880px; border-collapse: separate; border-spacing: 0; text-align: left; }
    .ds-table thead { position: sticky; top: 0; z-index: 10; }
    .ds-table th { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted-foreground); background: rgb(16 16 24 / 0.95); backdrop-filter: blur(4px); border-bottom: 1px solid var(--border); padding: 14px 16px; }
    .ds-table td { border-bottom: 1px solid var(--border); padding: 14px 16px; font-size: 14px; }
    .ds-table tbody tr { cursor: pointer; transition: background 0.2s; }
    .ds-table tbody tr:hover { background: var(--elevated); }
    .ds-table .row-accent { position: absolute; top: 6px; bottom: 6px; left: 0; width: 2px; border-radius: 999px; background: linear-gradient(var(--primary), var(--accent)); transform: scaleY(0); transform-origin: top; transition: transform 0.2s; }
    .ds-table tbody tr:hover .row-accent { transform: scaleY(1); }

    /* Componentes compartidos por las vistas del CRM */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 20px; color: var(--card-foreground);
    }
    .card-sm {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 16px; color: var(--card-foreground);
    }
    .kpi-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 18px 20px;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.5s ease-out both;
    }
    .kpi-card:hover { background: var(--elevated); }

    th {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted-foreground); background: var(--secondary);
    }
    tr.data-row:hover td { background: var(--elevated); }
    tr.lead-row:hover td { background: var(--elevated); cursor: pointer; }

    .badge {
      font-size: 11px; font-weight: 600; padding: 2px 10px;
      border-radius: 999px; display: inline-flex; align-items: center; gap: 4px;
    }
    .badge-neutral { background: var(--secondary); color: var(--muted-foreground); border: 1px solid var(--border); }
    .badge-info { background: var(--info-soft); color: var(--info); border: 1px solid rgb(106 166 255 / 0.3); }
    .badge-success { background: var(--success-soft); color: var(--success); border: 1px solid rgb(43 212 189 / 0.3); }
    .badge-warning { background: var(--warning-soft); color: var(--warning); border: 1px solid rgb(245 177 76 / 0.3); }
    .badge-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid rgb(242 114 109 / 0.3); }
    .badge-accent { background: var(--accent-soft); color: #a78bfa; border: 1px solid rgb(139 92 246 / 0.3); }
    .badge-primary { background: var(--primary-soft); color: var(--primary); border: 1px solid rgb(43 212 189 / 0.35); }
    .table-shell { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; }

    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      color: var(--primary-foreground);
      border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 600;
      transition: box-shadow 0.2s, transform 0.15s; border: none; cursor: pointer; white-space: nowrap;
    }
    .btn-primary:hover { box-shadow: 0 0 30px -8px rgb(43 212 189 / 0.6); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.4; pointer-events: none; }
    .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: rgb(26 26 36 / 0.6); color: var(--foreground);
      border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500;
      transition: all 0.2s; border: 1px solid var(--border); cursor: pointer; white-space: nowrap;
    }
    .btn-ghost:hover { background: var(--primary-soft); border-color: rgb(43 212 189 / 0.4); color: var(--primary); }
    .btn-primary.btn-lg, .btn-ghost.btn-lg { padding: 10px 16px; font-size: 14px; }
    .btn-ghost.btn-lg { padding: 10px 14px; }

    .input {
      background: var(--elevated); border: 1px solid var(--input);
      border-radius: var(--radius-md); padding: 8px 12px; font-size: 13px;
      color: var(--foreground); outline: none;
      transition: border-color 0.15s, box-shadow 0.15s; width: 100%;
    }
    .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgb(43 212 189 / 0.15); }
    .input::placeholder { color: var(--muted-foreground); }
    select.input { cursor: pointer; }
    select.input option { background: var(--elevated); color: var(--foreground); }

    .skeleton {
      background: linear-gradient(90deg, var(--secondary) 25%, var(--elevated) 50%, var(--secondary) 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius-sm);
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .nice-scroll { scrollbar-width: thin; scrollbar-color: #2c2c3a transparent; }
    .nice-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
    .nice-scroll::-webkit-scrollbar-thumb { background: #2c2c3a; border-radius: 999px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2c2c3a; border-radius: 999px; }

    /* Motion */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dropPulse {
      0% { box-shadow: inset 0 0 0 0 transparent; }
      40% { box-shadow: inset 0 0 0 1px rgb(43 212 189 / 0.45); }
      100% { box-shadow: inset 0 0 0 0 transparent; }
    }
    .anim-fade-up { animation: fadeUp 0.5s ease-out both; }
    .view-enter { animation: fadeUp 0.35s ease-out both; }
    .view-fade-out { opacity: 0; transform: translateY(6px); transition: opacity 0.12s ease, transform 0.12s ease; }
    tr.lead-row, tr.data-row { transition: background 0.15s ease; }
    .stagger-row { animation: fadeUp 0.35s ease-out both; }
    .bar-track { overflow: hidden; border-radius: 999px; background: var(--secondary); }
    .bar-fill { height: 100%; border-radius: 999px; width: 0%; transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
    #lead-modal:not(.hidden) { opacity: 0; transition: opacity 0.18s ease; }
    #lead-modal.is-open { opacity: 1; }
    #lead-modal .modal-panel { transform: translateY(12px) scale(0.97); transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1); }
    #lead-modal.is-open .modal-panel { transform: translateY(0) scale(1); animation: modalIn 0.22s ease-out; }
    #toast.toast-in { animation: toastIn 0.28s ease-out both; }

    /* Vistas */
    .view-pad { padding: 48px 20px; }
    @media (min-width: 768px) { .view-pad { padding: 48px 32px; } }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* Layout responsive: sidebar off-canvas < lg */
    .crm-main { margin-left: 16rem; }
    .crm-scrim { display: none; }
    @media (max-width: 1023px) {
      .crm-main { margin-left: 0; }
      .crm-sidebar { transform: translateX(-100%); transition: transform 0.22s ease; }
      body.nav-open .crm-sidebar { transform: none; box-shadow: 0 0 60px rgb(0 0 0 / 0.6); }
      body.nav-open .crm-scrim { display: block; position: fixed; inset: 0; background: rgb(0 0 0 / 0.5); z-index: 35; }
      .view-pad { padding: 32px 16px; }
    }

    /* Timeline (ficha de contacto) */
    .timeline { position: relative; padding-left: 26px; }
    .timeline::before { content: ''; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: var(--border); border-radius: 2px; }
    .timeline-item { position: relative; padding-bottom: 18px; }
    .timeline-dot {
      position: absolute; left: -26px; top: 2px; width: 20px; height: 20px; border-radius: 999px;
      display: grid; place-items: center; background: var(--elevated); border: 1px solid var(--border);
      font-size: 10px;
    }

    .mail-frame { width: 100%; border: 0; background: #fff; border-radius: 10px; min-height: 240px; }

    @media print {
      .crm-sidebar, .crm-topbar, .no-print, #toast { display: none !important; }
      .crm-main { margin-left: 0 !important; }
      body { background: #fff !important; color: #111 !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      .anim-fade-up, .ds-kpi, .kpi-card, .kanban-card, .view-enter, .stagger-row, #toast.toast-in,
      #lead-modal .modal-panel, .kanban-col.drop-pulse, .ds-popover, .gs-panel { animation: none !important; }
      .view-fade-out, #lead-modal, #lead-modal .modal-panel, .bar-fill, .dd-panel, .dd-scrim, .sb-item { transition: none !important; }
      .bar-fill { width: var(--bar-target, 0%) !important; }
    }
  </style>
</head>
<body class="min-h-screen">

  <aside class="crm-sidebar" id="crm-sidebar" aria-label="Navegación"></aside>
  <div class="crm-scrim" onclick="toggleMobileNav(false)"></div>

  <div class="crm-main flex min-h-screen min-w-0 flex-col">
    <header class="crm-topbar" id="crm-topbar"></header>
    <main id="view-root" class="flex-1 min-w-0"></main>
  </div>

  <!-- Modal compartido (leads, formularios) -->
  <div id="lead-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgb(4 4 10 / 0.7);backdrop-filter:blur(4px);">
    <div class="modal-panel w-full max-w-lg max-h-[88vh] flex flex-col rounded-2xl shadow-2xl"
         style="background:var(--card);border:1px solid var(--border);">
      <div class="flex items-start justify-between p-5" style="border-bottom:1px solid var(--border);">
        <div>
          <h2 id="modal-name" class="display text-2xl" style="color:var(--foreground);"></h2>
          <p id="modal-source" class="text-xs mt-1" style="color:var(--muted-foreground);"></p>
        </div>
        <button onclick="closeModal()" class="dd-icon-btn" aria-label="Cerrar">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-body" class="overflow-y-auto p-5 space-y-4 flex-1 nice-scroll"></div>
      <div class="p-4" id="modal-footer" style="border-top:1px solid var(--border);background:var(--elevated);">
        <p class="eyebrow mb-2.5" id="modal-footer-label" style="color:var(--muted-foreground);">Cambiar estado</p>
        <div class="flex gap-1.5 flex-wrap" id="modal-status-buttons"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-5 right-5 z-50"></div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/views/deal-drawer.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/leads.js"></script>
  <script src="/js/views/agent.js"></script>
  <script src="/js/views/propuestas.js"></script>
  <script src="/js/views/calendar.js"></script>
  <script src="/js/views/settings.js"></script>
  <script src="/js/views/pipeline.js"></script>
  <script src="/js/views/deals.js"></script>
  <script src="/js/views/companies.js"></script>
  <script src="/js/views/contacts.js"></script>
  <script src="/js/views/activities.js"></script>
  <script src="/js/views/inbox.js"></script>
  <script src="/js/views/mail.js"></script>
  <script src="/js/views/tasks.js"></script>
  <script src="/js/views/reports.js"></script>
  <script>
    const token = localStorage.getItem('crm_token');
    if (!token) window.location.href = '/login.html';

    function logout() {
      localStorage.removeItem('crm_token');
      localStorage.removeItem('crm_user');
      window.location.href = '/login.html';
    }

    function navigate(view) {
      const next = '#' + String(view || 'dashboard').replace(/^#/, '');
      // Always render: hashchange does not fire when the hash is unchanged
      if (window.location.hash === next) {
        renderView(next);
        return;
      }
      window.location.hash = next;
    }

    renderShell();

    async function renderView(hash) {
      const view = (hash || '').replace(/^#/, '') || 'dashboard';
      shellSetActive(view);
      toggleMobileNav(false);
      if (document.body.classList.contains('dd-open')) closeDealDrawer();

      const root = document.getElementById('view-root');
      if (!root) return;

      if (!prefersReducedMotion()) {
        root.classList.add('view-fade-out');
        await new Promise((r) => setTimeout(r, 110));
        root.classList.remove('view-fade-out', 'view-enter');
      }

      if (view === 'chatbox') {
        // Same-origin embed — Vite build outputs to public/chatbox/ with VITE_* baked in
        const CHATBOX_SRC = window.CRM_CHATBOX_URL || '/chatbox/';
        root.className = 'flex-1 min-w-0';
        root.innerHTML = `<iframe
          src="${CHATBOX_SRC}"
          title="Chatbox · Lead scoring"
          class="w-full border-0 block"
          style="height:calc(100vh - 75px);background:var(--background);"
          allow="clipboard-write"
        ></iframe>`;
        return;
      }

      // El Panel arma su propio hero a ancho completo; el resto usa el padding del diseño
      root.className = view === 'dashboard' ? 'flex-1 min-w-0' : 'flex-1 min-w-0 view-pad';
      root.innerHTML = `<div class="flex items-center justify-center h-64">
        <div class="flex flex-col items-center gap-3" style="color:var(--muted-foreground);">
          <svg class="w-5 h-5 spinning" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>
          <span class="text-sm">Cargando...</span>
        </div>
      </div>`;

      let pending = null;
      if (view === 'dashboard')           pending = renderDashboard(root);
      else if (view === 'calendar')       pending = renderCalendar(root);
      else if (view === 'settings')       pending = Promise.resolve(renderSettings(root));
      else if (view === 'pipeline')       pending = renderPipeline(root);
      else if (view === 'deals')          pending = renderDealsPipeline(root);
      else if (view === 'companies')      pending = renderCompanies(root);
      else if (view === 'contacts' || view.startsWith('contacts/')) pending = renderContacts(root, view.split('/')[1] || null);
      else if (view === 'activities')     pending = renderActivities(root);
      else if (view === 'inbox')          pending = renderInbox(root);
      else if (view === 'mail')           pending = renderMail(root);
      else if (view === 'tasks')          pending = renderTasks(root);
      else if (view === 'reports')        pending = renderReports(root);
      else if (view === 'propuestas')     pending = renderPropuestasMenu(root);
      else if (view.startsWith('agent/')) pending = renderAgent(root, view.split('/')[1]);
      else if (view.startsWith('leads')) {
        const source = view.includes('/') ? view.split('/')[1] : null;
        pending = renderLeads(root, source);
      } else {
        root.innerHTML = `<div class="p-8 text-sm" style="color:var(--muted-foreground);">Vista no encontrada: <code>${_escHtml(view)}</code></div>`;
      }

      try { if (pending && typeof pending.then === 'function') await pending; } catch (_) {}
      playViewEnter(root);
    }

    window.addEventListener('hashchange', () => renderView(window.location.hash));
    const _firstView = window.location.hash || '#dashboard';
    renderView(_firstView);
    // El Panel ya trae estos datos; si se entra por otra vista, cargar objetivo y badge de Pipeline aparte
    if (_firstView !== '#dashboard') shellLoadDashboardData();

    let currentLeadId = null;
    let _modalCloseTimer = null;
    function openLeadModal(lead) {
      currentLeadId = lead.id;
      window._currentLead = lead;
      document.getElementById('modal-name').textContent = lead.name || 'Sin nombre';
      document.getElementById('modal-source').textContent = (sourceLabel[lead.source] || lead.source) + ' · ' + fmtDate(lead.created_at);
      document.getElementById('modal-body').innerHTML = renderLeadDetail(lead);
      const footer = document.getElementById('modal-footer');
      const footerLabel = document.getElementById('modal-footer-label');
      if (footer) footer.style.display = '';
      if (footerLabel) footerLabel.style.display = '';
      const statuses = ['new','contacted','qualified','won','lost'];
      document.getElementById('modal-status-buttons').innerHTML = statuses.map(s => `
        <button type="button" onclick="changeLeadStatus('${lead.id}','${s}')"
          class="badge cursor-pointer hover:opacity-80 transition py-1 px-3"
          style="${s === lead.status ? statusColors[s] : statusInactive}">
          ${statusLabel[s]}
        </button>`).join('');
      const modal = document.getElementById('lead-modal');
      clearTimeout(_modalCloseTimer);
      modal.classList.remove('hidden');
      requestAnimationFrame(() => {
        modal.classList.add('is-open');
        hydrateMotion(modal);
      });
      initLeadPropuestaAssign(lead);
    }

    function closeModal() {
      const modal = document.getElementById('lead-modal');
      modal.classList.remove('is-open');
      currentLeadId = null;
      window._currentLead = null;
      clearTimeout(_modalCloseTimer);
      _modalCloseTimer = setTimeout(() => {
        modal.classList.add('hidden');
      }, prefersReducedMotion() ? 0 : 180);
    }
    document.getElementById('lead-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('lead-modal')) closeModal();
    });

    async function changeLeadStatus(id, status) {
      const res = await api(`/api/leads/${id}/status`, { method: 'PATCH', body: { status } });
      closeModal();
      if (status === 'won' && typeof celebrate === 'function') celebrate();
      if (status === 'qualified') {
        showToast('Calificado — contact + deal + briefing');
      } else if (status === 'won') {
        showToast('Ganado — contact + deal + client');
      } else {
        showToast(`Estado: ${statusLabel[status]}`);
      }
      if (res?.ok === false) showToast(res.error || 'Error al actualizar', 'error');
      renderView(window.location.hash);
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      if (!t) return;
      const isError = type === 'error';
      const accent = isError ? 'var(--danger)' : 'var(--success)';
      t.innerHTML = `<span>${msg}</span>`;
      t.style.cssText = `position:fixed;bottom:20px;right:20px;background:var(--elevated);border:1px solid var(--border);border-left:3px solid ${accent};border-radius:12px;padding:12px 16px;font-size:13px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.35);display:flex;align-items:center;gap:10px;min-width:192px;color:${isError?'var(--danger)':'var(--foreground)'};font-family:var(--font-sans);`;
      t.classList.remove('hidden', 'toast-in');
      void t.offsetWidth;
      t.classList.add('toast-in');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        t.classList.add('hidden');
        t.classList.remove('toast-in');
        t.style.display = 'none';
      }, 3500);
    }

    // Auto-refresh del Panel: no interrumpir drag & drop, ficha ni modales abiertos
    setInterval(() => {
      if ((window.location.hash || '#dashboard') !== '#dashboard') return;
      if (window._kanbanDragging || document.body.classList.contains('dd-open')) return;
      if (!document.getElementById('lead-modal').classList.contains('hidden')) return;
      if (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
      if (typeof refreshDashboard === 'function') refreshDashboard();
    }, 60000);

    refreshNavBadges();
    setInterval(refreshNavBadges, 120000);
  </script>
</body>
</html>
