<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    .input-field {
      width: 100%; background: white; border: 1px solid #D1D5DB;
      border-radius: 6px; padding: 10px 14px; font-size: 14px;
      color: #111827; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-field:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .input-field::placeholder { color: #9CA3AF; }
  </style>
</head>
<body style="background:#F8F9FA;" class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-xl flex items-center justify-center font-bold text-xl mx-auto mb-5 shadow-md text-white" style="background:#1A1D23;">D</div>
      <h1 class="text-2xl font-bold tracking-tight" style="color:#111827;">Marketing Dana</h1>
      <p class="text-sm mt-1.5" style="color:#6B7280;">Sistema operativo de la agencia</p>
    </div>

    <!-- Card -->
    <div class="bg-white border border-gray-200 rounded-xl p-7 shadow-sm">
      <form id="login-form" class="space-y-4">
        <div>
          <label class="text-xs font-semibold uppercase tracking-wider mb-1.5 block" style="color:#6B7280;">Email</label>
          <input id="email" type="email" required placeholder="tu@email.com" class="input-field">
        </div>
        <div>
          <label class="text-xs font-semibold uppercase tracking-wider mb-1.5 block" style="color:#6B7280;">Contraseña</label>
          <input id="password" type="password" required placeholder="••••••••" class="input-field">
        </div>

        <div id="error-wrap" class="hidden bg-red-50 border border-red-200 rounded-lg px-3 py-2.5">
          <p id="error-msg" class="text-red-600 text-sm"></p>
        </div>

        <button type="submit" id="login-btn"
          class="w-full text-white rounded-lg py-2.5 text-sm font-semibold mt-1 flex items-center justify-center gap-2 transition-colors"
          style="background:#2563EB;">
          Ingresar
        </button>
      </form>
    </div>

    <p class="text-center text-xs mt-6" style="color:#9CA3AF;">CRM · Agentes IA</p>
  </div>

  <script>
    if (localStorage.getItem('crm_token')) window.location.href = '/app.html';

    document.getElementById('login-btn').addEventListener('mouseover', function() { this.style.background='#1D4ED8'; });
    document.getElementById('login-btn').addEventListener('mouseout',  function() { this.style.background='#2563EB'; });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg> Ingresando...';
      btn.disabled = true;

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });

      const data = await res.json();
      if (data.ok) {
        localStorage.setItem('crm_token', data.token);
        localStorage.setItem('crm_user', JSON.stringify(data.user));
        window.location.href = '/app.html';
      } else {
        document.getElementById('error-msg').textContent = data.error;
        document.getElementById('error-wrap').classList.remove('hidden');
        btn.innerHTML = 'Ingresar';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
